
<form id="profile-setup-form">
  <label for="setup-phone">Telefone</label>
  <input
    id="setup-phone"
    type="tel"
    maxlength="30"
    placeholder="(34) 99999-9999"
    required
  >

  <label>Categoria cadastrada pela Diretoria</label>
  <div id="setup-rider-type-display" class="profile-field">
    <strong id="setup-rider-type-label">Piloto</strong>
    <small class="muted">
      Para alterar sua categoria, entre em contato com a Diretoria.
    </small>
  </div>

  <div id="setup-motorcycle-wrap">
    <label for="setup-motorcycle">
      Motocicleta principal (marca, modelo e ano)
    </label>
    <input
      id="setup-motorcycle"
      maxlength="120"
      placeholder="Ex.: Royal Enfield Himalayan 411 2021"
    >
  </div>

  <div id="setup-pilot-wrap" class="hidden">
    <label for="setup-pilot-id">Qual piloto acompanha você?</label>
    <select id="setup-pilot-id">
      <option value="">Selecione o piloto</option>
    </select>
  </div>

  <button
    id="save-profile-setup-button"
    class="btn btn-primary btn-block"
    type="submit"
  >
    Salvar e continuar →
  </button>

  <div
    id="profile-setup-notice"
    class="notice"
    role="status"
    aria-live="polite"
  ></div>
</form>
