name: Deploy Passkeys to Supabase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing GitHub secret: SUPABASE_PROJECT_REF" && exit 1)
      - name: Deploy Passkey functions directly to project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy passkey-register-options --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy passkey-register-verify --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy passkey-auth-options --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy passkey-auth-verify --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
